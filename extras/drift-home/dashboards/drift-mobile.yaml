# TEMPLATE: replace every domain.replace_me_* with an existing entity ID, or remove its card.
# Room names are editable examples, not a detected floor plan. No device IDs are used.
title: Drift Home · Mobile
views:
- title: Home
  path: home
  type: sections
  max_columns: 1
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Favorites
      heading_style: title
    - type: tile
      entity: light.replace_me_kitchen
      name: Kitchen
      tap_action:
        action: more-info
      icon_tap_action:
        action: toggle
      icon: mdi:countertop-outline
      features:
      - type: light-brightness
    - type: tile
      entity: light.replace_me_living
      name: Living room
      tap_action:
        action: more-info
      icon_tap_action:
        action: toggle
      icon: mdi:sofa-outline
      features:
      - type: light-brightness
    - type: tile
      entity: climate.replace_me_home
      name: Home climate
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Morning
        icon: mdi:weather-sunny
        tap_action:
          action: perform-action
          perform_action: scene.turn_on
          target:
            entity_id: scene.replace_me_morning
          confirmation:
            text: Activate Morning?
        hold_action:
          action: none
      - type: button
        name: Evening
        icon: mdi:weather-sunset
        tap_action:
          action: perform-action
          perform_action: scene.turn_on
          target:
            entity_id: scene.replace_me_evening
          confirmation:
            text: Activate Evening?
        hold_action:
          action: none
      - type: button
        name: Good night
        icon: mdi:moon-waning-crescent
        tap_action:
          action: perform-action
          perform_action: scene.turn_on
          target:
            entity_id: scene.replace_me_goodnight
          confirmation:
            text: Activate Good night?
        hold_action:
          action: none
  - type: grid
    cards:
    - type: heading
      heading: At home
      heading_style: title
    - type: markdown
      content: '# {{ "Good morning" if now().hour < 12 else "Good afternoon" if now().hour < 18 else "Good evening"
        }}

        {{ now().strftime("%A, %B %d") }} · Drift Home'
    - &id001
      type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Upstairs
        icon: mdi:home-floor-1
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /drift-mobile/upstairs
        hold_action:
          action: none
      - type: button
        name: Main
        icon: mdi:home-floor-0
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /drift-mobile/main
        hold_action:
          action: none
      - type: button
        name: Basement
        icon: mdi:home-floor-b
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /drift-mobile/basement
        hold_action:
          action: none
    - type: weather-forecast
      entity: weather.replace_me_home
      show_forecast: false
  - type: grid
    cards:
    - type: heading
      heading: Home status
      heading_style: title
    - type: tile
      entity: binary_sensor.replace_me_leak
      name: Water leak
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:water-alert-outline
    - type: tile
      entity: binary_sensor.replace_me_front_door
      name: Front door
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:door
    - type: tile
      entity: sensor.replace_me_kitchen_temperature
      name: Kitchen temperature
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
    - type: tile
      entity: sensor.replace_me_kitchen_humidity
      name: Kitchen humidity
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
    - type: button
      name: Status & devices
      icon: mdi:heart-pulse
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /drift-mobile/status
      hold_action:
        action: none
