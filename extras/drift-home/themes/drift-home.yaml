# Drift Home • native Home Assistant theme. Select theme in your profile.
Drift Home:
  primary-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
  ha-card-border-radius: 22px
  ha-card-border-width: 1px
  ha-card-box-shadow: 0 6px 22px rgba(0, 0, 0, 0.04)
  state-light-active-color: '#C87912'
  state-binary_sensor-moisture-on-color: '#D92D35'
  state-binary_sensor-door-on-color: '#C87912'
  modes:
    light:
      primary-color: '#0066CC'
      accent-color: '#0066CC'
      primary-background-color: '#F2F3F7'
      secondary-background-color: '#FFFFFF'
      lovelace-background: '#F2F3F7'
      card-background-color: '#FFFFFF'
      ha-card-background: '#FFFFFF'
      primary-text-color: '#1D1D1F'
      secondary-text-color: '#626773'
      disabled-text-color: '#626773'
      divider-color: '#DFE2E9'
      ha-card-border-color: '#DFE2E9'
      app-header-background-color: '#F2F3F7'
      app-header-text-color: '#1D1D1F'
      sidebar-background-color: '#FFFFFF'
      sidebar-text-color: '#1D1D1F'
      sidebar-selected-text-color: '#0066CC'
      sidebar-selected-icon-color: '#0066CC'
      state-icon-color: '#626773'
      paper-item-icon-color: '#626773'
      input-fill-color: '#F2F3F7'
      input-ink-color: '#1D1D1F'
      switch-checked-color: '#0066CC'
    dark:
      primary-color: '#75AFFF'
      accent-color: '#75AFFF'
      primary-background-color: '#111216'
      secondary-background-color: '#1D1F25'
      lovelace-background: '#111216'
      card-background-color: '#1D1F25'
      ha-card-background: '#1D1F25'
      primary-text-color: '#F5F5F7'
      secondary-text-color: '#ADB2BE'
      disabled-text-color: '#ADB2BE'
      divider-color: '#343741'
      ha-card-border-color: '#343741'
      app-header-background-color: '#111216'
      app-header-text-color: '#F5F5F7'
      sidebar-background-color: '#1D1F25'
      sidebar-text-color: '#F5F5F7'
      sidebar-selected-text-color: '#75AFFF'
      sidebar-selected-icon-color: '#75AFFF'
      state-icon-color: '#ADB2BE'
      paper-item-icon-color: '#ADB2BE'
      input-fill-color: '#111216'
      input-ink-color: '#F5F5F7'
      switch-checked-color: '#75AFFF'
